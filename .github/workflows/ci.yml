name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma only needs a syntactically valid connection string to generate the
  # client and to type-check. Nothing in this workflow connects to a database, so
  # no production secret is required.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/campus_connect?schema=public'
  JWT_SECRET: 'ci-placeholder-secret-not-used-for-any-real-session'
  NEXT_PUBLIC_API_BASE: 'http://localhost:4000'

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate

      - name: Type-check every workspace
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the API and the web app
        run: npm run build

      - name: Confirm design-handoff is untouched
        run: |
          # The design export is the reference the build was made from and must
          # never be edited. Fail loudly if a commit changes it.
          if ! git diff --quiet origin/${{ github.event.repository.default_branch }} -- design-handoff/ 2>/dev/null; then
            echo "::warning::design-handoff/ differs from the default branch — it is reference-only and should not be modified."
          fi

      - name: Confirm no .env file was committed
        run: |
          if git ls-files --error-unmatch '*.env' '**/.env' 2>/dev/null; then
            echo "::error::A .env file is tracked. Remove it and keep secrets out of the repository."
            exit 1
          fi
          echo "No tracked .env files."
